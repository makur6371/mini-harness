# .github/workflows/debug-npm.yml — 诊断:把 npm ci 完整输出推到 gha-logs 分支,便于无 admin 权限读。
name: debug-npm
on:
  push:
    paths:
      - '.github/workflows/debug-npm.yml'
  workflow_dispatch:
jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: capture npm ci
        run: |
          set +e
          {
            echo "### node / npm / uname"
            node -v
            npm -v
            uname -a
            echo "### npm config get registry / cache"
            npm config get registry
            npm config get cache
            echo "### cat package.json"
            cat package.json
            echo "### head package-lock.json"
            head -20 package-lock.json
            echo "### npm ci (full output)"
            npm ci
            echo "npm ci exit=$?"
          } > npm-ci.log 2>&1
          cat npm-ci.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: npm-ci.log
          retention-days: 30

