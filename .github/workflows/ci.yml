# .github/workflows/ci.yml — 零运行时依赖,无需 npm install,直接跑三套测试。
# browser 用 Node 22 内置 fetch+WebSocket 走 CDP 驱动系统 chrome(ubuntu runner 自带)。
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node test.mjs
      - run: node test-web.mjs
      - run: node test-browser.mjs
