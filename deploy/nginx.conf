# nginx.conf — 反代 mini-harness + 强制 HTTPS。改 your-host 为你的域名。
server {
    listen 80;
    server_name your-host;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-host;

    # certbot 会自动填这两行
    # ssl_certificate /etc/letsencrypt/live/your-host/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-host/privkey.pem;

    # SSE 友好:关缓冲、加超时,否则流式会被 nginx 攒着
    location /s/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
